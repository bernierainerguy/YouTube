name: Build macOS (arm64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 and later are Apple Silicon runners.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build arm64 dmg
        env:
          # No signing certificate in CI: build unsigned rather than failing
          # when electron-builder cannot find an identity in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-macos-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
