name: macOS release (arm64)

# Builds the Apple Silicon dmg. When the Developer ID signing secrets are
# present the dmg is signed, notarised and stapled; without them it falls
# back to an unsigned build so the workflow is still useful for test builds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 and later are Apple Silicon runners.
    runs-on: macos-14

    steps:
      - name: Check out YT Grab
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect signing credentials
        id: creds
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$APPLE_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID secrets present: building signed and notarised."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Developer ID secrets absent - building UNSIGNED."
          fi

      - name: Import Developer ID certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build signed and notarised dmg
        if: steps.creds.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --publish never: artefacts are uploaded by the steps below, and
        # electron-builder otherwise tries to publish and demands GH_TOKEN.
        run: npx electron-builder --mac --arm64 --publish never

      - name: Sign, notarise and staple the dmg
        if: steps.creds.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No dmg produced."
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "Signing $(basename "$dmg")..."
            codesign --force --timestamp \
              --sign "Developer ID Application: Bernie Rainer-Guy (T57Q5FRCB6)" "$dmg"
            codesign --verify --verbose=2 "$dmg"

            echo "Submitting $(basename "$dmg") to Apple notarisation..."
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait

            xcrun stapler staple -v "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vvv "$dmg"
          done

      - name: Build unsigned dmg
        if: steps.creds.outputs.signed == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac --arm64 --publish never \
            -c.mac.identity=null -c.mac.notarize=false

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: >-
            YT-Grab-${{ steps.creds.outputs.signed == 'true' && 'signed' || 'unsigned' }}-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap

      - name: Clean up keychain
        if: always() && steps.creds.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
