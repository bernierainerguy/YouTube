name: Build macOS (arm64, unsigned)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 and later are Apple Silicon runners.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned arm64 dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # Signed, notarised releases come from build-mac.command on the Mac.
        # CI has neither the Developer ID certificate nor notary credentials,
        # so identity and notarisation are both turned off explicitly —
        # build.mac.notarize is true for the local release flow.
        run: npx electron-builder --mac --arm64 -c.mac.identity=null -c.mac.notarize=false

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-macos-arm64-unsigned
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
